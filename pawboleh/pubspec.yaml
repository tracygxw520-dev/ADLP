name: pawboleh
description: Gema — AI marketing workspace for growing brands.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Matches the Dart SDK bundled with the current Flutter stable release.
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/gema_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/gema_logo.png
  min_sdk_android: 21
